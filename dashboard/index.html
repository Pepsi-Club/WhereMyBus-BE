<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>버스어디 API Dashboard</title>
    <link rel="stylesheet" href="/dashboard/dashboard.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
      integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="/dashboard/dashboard.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section
        id="login-view"
        class="login-panel"
        aria-labelledby="login-title"
      >
        <p class="eyebrow">WHERE MY BUS · OPERATIONS</p>
        <h1 id="login-title">버스 API Dashboard</h1>
        <p class="login-copy">
          운영 통계를 확인하려면 개발자 코드를 입력하세요.
        </p>
        <form id="login-form" class="login-form">
          <label for="access-code">개발자 코드</label>
          <input
            id="access-code"
            name="code"
            type="password"
            autocomplete="current-password"
            required
          />
          <button type="submit">Dashboard 열기</button>
        </form>
      </section>

      <section
        id="dashboard-view"
        class="dashboard"
        hidden
        aria-labelledby="dashboard-title"
      >
        <header class="dashboard-header">
          <div>
            <p class="eyebrow">BUS API · ASIA/SEOUL</p>
            <h1 id="dashboard-title">호출량 Dashboard</h1>
          </div>
          <div class="header-actions">
            <button id="refresh-button" class="secondary" type="button">
              새로고침
            </button>
            <button id="logout-button" class="secondary" type="button">
              로그아웃
            </button>
          </div>
        </header>

        <div id="summary-cards" class="summary-grid" aria-live="polite">
          <article class="summary-card accent-blue">
            <span>오늘 요청</span>
            <strong id="today-requests">0</strong>
          </article>
          <article class="summary-card accent-violet">
            <span>이번 달 요청</span>
            <strong id="month-requests">0</strong>
          </article>
          <article class="summary-card accent-green">
            <span>선택 기간 요청</span>
            <strong id="range-requests">0</strong>
          </article>
          <article class="summary-card accent-orange">
            <span>선택 기간 오류</span>
            <strong id="range-errors">0</strong>
          </article>
          <article class="summary-card accent-red">
            <span>오류율</span>
            <strong id="error-rate">0.00%</strong>
          </article>
        </div>

        <section class="chart-panel" aria-labelledby="chart-title">
          <div class="chart-toolbar">
            <div>
              <p class="eyebrow">REQUEST TREND</p>
              <h2 id="chart-title">기간별 요청 추이</h2>
            </div>
            <label>
              <span>조회 기간</span>
              <select id="range-select" aria-label="조회 기간">
                <option value="24h">최근 24시간</option>
                <option value="7d">최근 7일</option>
                <option value="30d">최근 30일</option>
                <option value="90d">최근 90일</option>
              </select>
            </label>
          </div>
          <section class="metric-filters" aria-labelledby="metric-filter-title">
            <div class="filter-heading">
              <h3 id="metric-filter-title">조회 필터</h3>
              <button id="filter-reset" class="secondary" type="button">
                초기화
              </button>
            </div>
            <fieldset class="weekday-fieldset">
              <legend>요일</legend>
              <div class="filter-presets" aria-label="요일 빠른 선택">
                <button
                  id="weekday-preset-all"
                  class="secondary"
                  type="button"
                  data-weekday-preset="all"
                >
                  전체
                </button>
                <button
                  id="weekday-preset-weekday"
                  class="secondary"
                  type="button"
                  data-weekday-preset="weekday"
                >
                  평일
                </button>
                <button
                  id="weekday-preset-weekend"
                  class="secondary"
                  type="button"
                  data-weekday-preset="weekend"
                >
                  주말
                </button>
              </div>
              <div id="weekday-filters" class="filter-options"></div>
            </fieldset>
            <fieldset id="provider-fieldset" disabled>
              <legend>제공기관</legend>
              <div id="provider-filters" class="filter-options"></div>
            </fieldset>
            <fieldset id="operation-fieldset" disabled>
              <legend>호출 API</legend>
              <div id="operation-filters" class="filter-options"></div>
            </fieldset>
            <p id="dimension-state" role="status" aria-live="polite"></p>
            <button id="filter-apply" type="button" disabled>필터 적용</button>
          </section>
          <div class="chart-container">
            <canvas
              id="request-chart"
              role="img"
              aria-label="선택 기간 요청 및 오류 추이"
            ></canvas>
            <p
              id="chart-state"
              class="chart-state"
              role="status"
              aria-live="polite"
              hidden
            ></p>
          </div>
          <p class="collected-at">
            마지막 수집: <time id="last-collected-at">수집 내역 없음</time>
          </p>
        </section>
      </section>

      <p id="status-message" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
