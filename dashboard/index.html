<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>버스어디 API Dashboard</title>
    <link rel="stylesheet" href="/dashboard/dashboard.css" />
    <script src="/dashboard/dashboard.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section
        id="login-view"
        class="login-panel"
        aria-labelledby="login-title"
      >
        <p class="eyebrow">WHERE MY BUS · OPERATIONS</p>
        <h1 id="login-title">버스 API Dashboard</h1>
        <p class="login-copy">
          운영 통계를 확인하려면 개발자 코드를 입력하세요.
        </p>
        <form id="login-form" class="login-form">
          <label for="access-code">개발자 코드</label>
          <input
            id="access-code"
            name="code"
            type="password"
            autocomplete="current-password"
            required
          />
          <button type="submit">Dashboard 열기</button>
        </form>
      </section>

      <section
        id="dashboard-view"
        class="dashboard"
        hidden
        aria-labelledby="dashboard-title"
      >
        <header class="dashboard-header">
          <div>
            <p class="eyebrow">SEOUL BUS API · ASIA/SEOUL</p>
            <h1 id="dashboard-title">호출량 Dashboard</h1>
          </div>
          <div class="header-actions">
            <button id="refresh-button" class="secondary" type="button">
              새로고침
            </button>
            <button id="logout-button" class="secondary" type="button">
              로그아웃
            </button>
          </div>
        </header>

        <div id="summary-cards" class="summary-grid" aria-live="polite">
          <article class="summary-card accent-blue">
            <span>오늘 요청</span>
            <strong id="today-requests">0</strong>
          </article>
          <article class="summary-card accent-violet">
            <span>이번 달 요청</span>
            <strong id="month-requests">0</strong>
          </article>
          <article class="summary-card accent-green">
            <span>선택 기간 요청</span>
            <strong id="range-requests">0</strong>
          </article>
          <article class="summary-card accent-orange">
            <span>선택 기간 오류</span>
            <strong id="range-errors">0</strong>
          </article>
          <article class="summary-card accent-red">
            <span>오류율</span>
            <strong id="error-rate">0.00%</strong>
          </article>
        </div>

        <section class="chart-panel" aria-labelledby="chart-title">
          <div class="chart-toolbar">
            <div>
              <p class="eyebrow">REQUEST TREND</p>
              <h2 id="chart-title">기간별 요청 추이</h2>
            </div>
            <label>
              <span>조회 기간</span>
              <select id="range-select" aria-label="조회 기간">
                <option value="24h">최근 24시간</option>
                <option value="7d">최근 7일</option>
                <option value="30d">최근 30일</option>
                <option value="90d">최근 90일</option>
              </select>
            </label>
          </div>
          <svg
            id="request-chart"
            role="img"
            aria-labelledby="chart-title"
            preserveAspectRatio="none"
          ></svg>
          <p class="collected-at">
            마지막 수집: <time id="last-collected-at">수집 내역 없음</time>
          </p>
        </section>
      </section>

      <p id="status-message" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
